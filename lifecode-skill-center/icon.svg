<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LifeCode Skill Center">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39E1FF"/>
      <stop offset="0.52" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#17265E"/>
      <stop offset="0.68" stop-color="#0B1233"/>
      <stop offset="1" stop-color="#080D24"/>
    </radialGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#63E8FF"/>
      <stop offset="1" stop-color="#3E8DF7"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="1" y1="0" x2="0" y2="0.35">
      <stop offset="0" stop-color="#A98BFF"/>
      <stop offset="1" stop-color="#5F79FF"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8F7FF"/>
      <stop offset="1" stop-color="#49C9FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon body -->
  <path d="M256 30 L452 143 V369 L256 482 L60 369 V143 Z"
        fill="url(#core)" stroke="url(#rim)" stroke-width="24" stroke-linejoin="round"/>

  <!-- Inner rim highlight -->
  <path d="M256 62 L424 159 V353 L256 450 L88 353 V159 Z"
        fill="none" stroke="#39E1FF" stroke-opacity="0.18" stroke-width="4" stroke-linejoin="round"/>

  <!-- Bevel: lit upper-left edge, shaded lower-right edge -->
  <path d="M256 36 L66 146 V300" fill="none" stroke="#D8FAFF" stroke-opacity="0.34" stroke-width="9" stroke-linecap="round"/>
  <path d="M446 300 V366 L256 476" fill="none" stroke="#0A0F26" stroke-opacity="0.42" stroke-width="9" stroke-linecap="round"/>

  <!-- Knowledge stems -->
  <g fill="none" stroke="#5FE6FF" stroke-linecap="round" opacity="0.95">
    <path d="M256 178 V300" stroke-width="13"/>
    <path d="M198 222 Q198 262 226 286" stroke-width="11"/>
    <path d="M314 222 Q314 262 286 286" stroke-width="11"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#glow)">
    <circle cx="256" cy="152" r="27" fill="url(#node)"/>
    <circle cx="198" cy="206" r="19" fill="url(#node)" fill-opacity="0.95"/>
    <circle cx="314" cy="206" r="19" fill="url(#node)" fill-opacity="0.95"/>
  </g>
  <circle cx="256" cy="152" r="9" fill="#0B1233" fill-opacity="0.55"/>
  <circle cx="198" cy="206" r="6" fill="#0B1233" fill-opacity="0.5"/>
  <circle cx="314" cy="206" r="6" fill="#0B1233" fill-opacity="0.5"/>

  <!-- Open book -->
  <path d="M256 302 Q212 280 156 292 Q140 296 140 314 L140 366 Q140 380 156 378 Q214 364 250 386 L256 392 Z"
        fill="url(#pageLeft)"/>
  <path d="M256 302 Q300 280 356 292 Q372 296 372 314 L372 366 Q372 380 356 378 Q298 364 262 386 L256 392 Z"
        fill="url(#pageRight)"/>
  <path d="M256 302 V392" stroke="#0A1030" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <path d="M152 306 Q206 296 248 316" fill="none" stroke="#EAFBFF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <path d="M360 306 Q306 296 264 316" fill="none" stroke="#F3EEFF" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
</svg>
