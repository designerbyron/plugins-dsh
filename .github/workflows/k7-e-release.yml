name: K7-E · publicación gobernada por Release humano

# Único workflow que puede publicar. NO hay workflow_dispatch ni disparo por push:
# sólo un GitHub Release publicado por una persona, desde su tag.
#
# K8-E: acciones externas fijadas a SHA de 40 caracteres, verificadas contra los
# repositorios oficiales. setup-node se fija a v5.0.0 porque el SHA de v4 no
# acepta `package-manager-cache`; v5.0.0 sí lo acepta y conserva `cache: npm`.
#
# K8-F4: npm CLI fijado a 11.21.3 y publicación por etapas con `npm stage publish
# --tag next`. El job vuelve a verificar el SHA-256 del contenido exacto que se
# enviará a staging; no hay publicación pública directa ni dist-tag dinámico.

on:
  release:
    types: [published]

permissions: {}

# El package.json y la publicación viven en el subdirectorio del plugin, no en la raíz.
defaults:
  run:
    working-directory: lifecode-skill-center

concurrency:
  group: k7-e-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validar:
    name: Revalidar el tag con las puertas K7-E
    permissions:
      contents: read
    uses: ./.github/workflows/k7-e-validation.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  publicar:
    name: Publicar con Trusted Publishing OIDC
    needs: validar
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.sender.type == 'User' &&
      github.event.release.author.type == 'User'
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/dsh-lifecode-skill-center
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout del tag del Release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Node 24.21.0 sin registry-url ni token
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: npm CLI 11.21.3 fijado
        run: |
          npm install --global npm@11.21.3
          ACTUAL_NPM="$(npm --version)"
          if [ "$ACTUAL_NPM" != "11.21.3" ]; then
            echo "✖ npm fijado en 11.21.3, obtenido $ACTUAL_NPM" >&2
            exit 1
          fi
          echo "✓ npm CLI $ACTUAL_NPM"

      - name: Puerta humana, tag y versión
        id: gates
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_AUTHOR_TYPE: ${{ github.event.release.author.type }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const fail = (message) => {
            console.error(`✖ ${message}`);
            process.exit(1);
          };
          const tag = process.env.RELEASE_TAG;
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedTag = `lifecode-skill-center-v${manifest.version}`;
          const semver = /^(\d+)\.(\d+)\.(\d+)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/;
          const parsed = semver.exec(manifest.version);
          if (!parsed) fail(`versión no SemVer: ${manifest.version}`);
          if (tag !== expectedTag) fail(`tag ${tag} ≠ ${expectedTag}`);
          const isPrerelease = Boolean(parsed[4]);
          if ((process.env.RELEASE_PRERELEASE === 'true') !== isPrerelease) {
            fail(`flags de Release y versión divergen: prerelease=${process.env.RELEASE_PRERELEASE}, versión=${manifest.version}`);
          }
          if (process.env.RELEASE_DRAFT === 'true') fail('el Release está en borrador');
          if (process.env.RELEASE_AUTHOR_TYPE !== 'User' || process.env.SENDER_TYPE !== 'User') {
            fail('el Release no fue publicado por una cuenta humana (author/sender ≠ User)');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          console.log(`✓ ${tag} → ${manifest.version}; contenido enviado a staging con --tag next`);
          NODE

      - name: Verificar OIDC y ausencia de tokens npm permanentes
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const fail = (message) => {
            console.error(`✖ ${message}`);
            process.exit(1);
          };
          const npmVersion = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          if (npmVersion !== '11.21.3') {
            fail(`npm ${npmVersion} ≠ 11.21.3; el staging exige la versión fijada exacta`);
          }
          const tokenVars = ['NODE_AUTH_TOKEN', 'NPM_TOKEN', 'NPM_AUTH_TOKEN', 'NPM_CONFIG__AUTH_TOKEN'];
          const present = tokenVars.filter((key) => Boolean(process.env[key]));
          if (present.length > 0) fail(`tokens npm permanentes presentes: ${present.join(', ')}`);
          const configs = [`${process.env.HOME}/.npmrc`, '.npmrc'].filter((file) => fs.existsSync(file));
          const withToken = configs.filter((file) => /_authToken\s*=/.test(fs.readFileSync(file, 'utf8')));
          if (withToken.length > 0) fail(`_authToken permanente en: ${withToken.join(', ')}`);
          if (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL || !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            fail('id-token: write no concedido: falta el token OIDC efímero de GitHub Actions');
          }
          console.log(`✓ npm ${npmVersion}; OIDC disponible; sin tokens npm permanentes`);
          NODE

      - name: Verificar SHA-256 del contenido que se enviará a staging
        env:
          EXPECTED_SHA256: fa2e9c9a193b8bc301541e66ca19444147739b866edfa748cea0af7955d512dc
        run: |
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/stage-pack.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const fail = (message) => {
            console.error(`✖ ${message}`);
            process.exit(1);
          };
          const EXPECTED_NAME = 'dsh-lifecode-skill-center';
          const EXPECTED_VERSION = '1.1.0-rc.2';
          const EXPECTED_FILENAME = 'dsh-lifecode-skill-center-1.1.0-rc.2.tgz';
          const EXPECTED_SHA256 = process.env.EXPECTED_SHA256;
          const runnerTemp = process.env.RUNNER_TEMP;

          if (!EXPECTED_SHA256) fail('EXPECTED_SHA256 no definido');
          if (!runnerTemp || !path.isAbsolute(runnerTemp)) fail('RUNNER_TEMP no es una ruta absoluta');
          if (!process.env.GITHUB_ENV) fail('GITHUB_ENV no definido');

          const packJson = path.join(runnerTemp, 'stage-pack.json');
          let packaged;
          try {
            packaged = JSON.parse(fs.readFileSync(packJson, 'utf8'));
          } catch (error) {
            fail(`JSON de npm pack no legible: ${error.message}`);
          }
          if (!Array.isArray(packaged) || packaged.length !== 1) {
            const found = Array.isArray(packaged) ? String(packaged.length) : 'un JSON no lista';
            fail(`npm pack devolvió ${found}; se esperaba exactamente 1 paquete`);
          }
          const [pkg] = packaged;
          if (pkg.name !== EXPECTED_NAME) fail(`name inesperado: ${pkg.name}`);
          if (pkg.version !== EXPECTED_VERSION) fail(`version inesperada: ${pkg.version}`);
          if (pkg.filename !== EXPECTED_FILENAME) fail(`filename inesperado: ${pkg.filename}`);

          const tarball = path.resolve(runnerTemp, EXPECTED_FILENAME);
          if (path.dirname(tarball) !== path.resolve(runnerTemp)) fail('el tarball no queda dentro de RUNNER_TEMP');
          if (/[\r\n]/.test(tarball)) fail('la ruta del tarball contiene saltos de línea');
          let stats;
          try {
            stats = fs.lstatSync(tarball);
          } catch (error) {
            fail(`tarball no accesible: ${error.message}`);
          }
          if (!stats.isFile()) fail('el tarball no es un fichero regular');

          const actualSha256 = crypto.createHash('sha256').update(fs.readFileSync(tarball)).digest('hex');
          if (actualSha256 !== EXPECTED_SHA256) {
            console.error('✖ SHA-256 del contenido a staging NO coincide; staging detenido');
            console.error(`  esperado (fijado en K8-C, no actualizar automáticamente): ${EXPECTED_SHA256}`);
            console.error(`  obtenido: ${actualSha256}`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGE_TARBALL=${tarball}\n`);
          console.log(`✓ tarball verificado y persistido: ${tarball}`);
          console.log(`✓ SHA-256 del contenido a staging verificado: ${actualSha256}`);
          NODE

      - name: Enviar a staging con npm stage publish
        env:
          EXPECTED_SHA256: fa2e9c9a193b8bc301541e66ca19444147739b866edfa748cea0af7955d512dc
        run: |
          if [ -z "${STAGE_TARBALL:-}" ]; then
            echo "✖ STAGE_TARBALL no definido; staging detenido" >&2
            exit 1
          fi
          case "$STAGE_TARBALL" in
            "$RUNNER_TEMP"/dsh-lifecode-skill-center-1.1.0-rc.2.tgz) ;;
            *)
              echo "✖ STAGE_TARBALL no corresponde al tarball verificado; staging detenido" >&2
              exit 1
              ;;
          esac
          if [ -L "$STAGE_TARBALL" ] || [ ! -f "$STAGE_TARBALL" ]; then
            echo "✖ STAGE_TARBALL no es un fichero regular; staging detenido" >&2
            exit 1
          fi
          ACTUAL_SHA256="$(sha256sum "$STAGE_TARBALL" | awk '{print $1}')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "✖ SHA-256 inmediatamente previo al staging NO coincide; staging detenido" >&2
            echo "  esperado (fijado en K8-C, no actualizar automáticamente): $EXPECTED_SHA256" >&2
            echo "  obtenido: $ACTUAL_SHA256" >&2
            exit 1
          fi
          echo "✓ SHA-256 inmediatamente previo al staging verificado: $ACTUAL_SHA256"
          npm stage publish "$STAGE_TARBALL" --tag next
